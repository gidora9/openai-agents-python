services:
  - type: web
    name: openai-agents-service
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: uvicorn deploy.agent_service.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SERVICE_API_KEY
        generateValue: true
      - key: OPENAI_AGENT_MODEL
        sync: false
